<!doctype html>
<!-- 用途：在独立浏览器中验证 Mermaid 样式注释，不连接个人知识库。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mermaid Plus · 注释样式实验</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { margin: 0; padding: 40px 32px; background: #f1f3ef; }
    main { max-width: 1200px; margin: auto; }
    .demo-kicker { color: #547367; font: 12px system-ui; letter-spacing: .12em; margin: 0 0 18px; }
    nav { display: flex; gap: 12px; margin-bottom: 24px; }
    nav button { padding: 8px 14px; border: 1px solid #b7c7bd; border-radius: 6px; background: transparent; color: #315f4f; cursor: pointer; }
  </style>
</head>
<body>
  <main><p class="demo-kicker">MERMAID PLUS / EXPERIMENT 02</p><nav aria-label="测试样例"><button id="style-example">样式示例</button><button id="layout-example">多分支与回路示例</button></nav><div id="app"></div></main>
  <script type="module" src="/app.js"></script>
</body>
</html>
